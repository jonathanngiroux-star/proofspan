name: proofspan CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Unit tests
        run: go test ./...
      - name: Regenerate shared corpus
        run: go run ./cmd/corpusgen testdata/corpus
      - name: Fidelity gate (parity ≥95%, MAD <2%, cost <0.5%)
        run: go run ./cmd/fidelitygen testdata/corpus docs/fidelity
      - name: Build
        run: go build -o proofspan ./cmd/proofspan
      - name: Migrate both sources
        run: |
          ./proofspan migrate --from=langsmith --db=ci.sqlite testdata/corpus/langsmith/corpus.jsonl
          ./proofspan migrate --from=honeyhive --db=ci.sqlite testdata/corpus/honeyhive/corpus.jsonl
      - name: Eval gate (span-correlation@1.0.0)
        run: ./proofspan eval --db=ci.sqlite
      - name: Judge gate (planted defect must fail, clean must pass)
        run: |
          if ./proofspan eval --db=ci.sqlite --trajectory=trj_00001 --judges-run=factual-consistency > /dev/null 2>&1; then
            echo "planted trajectory unexpectedly passed the judge"; exit 1
          fi
          if ! ./proofspan eval --db=ci.sqlite --trajectory=trj_00003 --judges-run=factual-consistency > /dev/null 2>&1; then
            echo "clean trajectory failed the judge"; exit 1
          fi
          echo "judge gate: planted defect caught, clean trajectory passed"
      - uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.9"
          verb: call
          args: eval --src=.

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # Fyne CGO deps — the exact set fyne-io/fyne's own CI installs on
      # Linux runners (platform_tests.yml).
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev xorg-dev
      - name: UI module tests (argv contracts + GUI/TUI e2e vs real CLI)
        working-directory: ui
        run: go test ./internal/app/ -v
      - name: Build GUI binary (Fyne, CGO)
        working-directory: ui/cmd/proofspan-gui
        run: go build -o proofspan-gui .
      - name: Build TUI binary (static, no CGO)
        working-directory: ui/cmd/proofspan-tui
        run: go build -o proofspan-tui .
